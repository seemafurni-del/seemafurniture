<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seema Furniture CMS</title>

    <!-- Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <h2 style="text-align:center; font-family:sans-serif;">Loading CMS...</h2>

    <!-- Optional: Netlify Identity widget (safe even if not used) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      // Initialize Decap CMS
      if (window.CMS) {
        CMS.init(); // ✅ This ensures CMS attaches properly
      }

      // Netlify login redirect
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
