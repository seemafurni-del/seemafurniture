  <script>
    const WHATSAPP_NUMBER = '917877816692';
    const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1UpK99vn1NVEdebcup1TmUDk7tuoQRRn1wRlVjGP21Zo/gviz/tq?tqx=out:json&sheet=Sheet1';
    let allProducts = [];

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'accent-yellow': '#FFC107',
          }
        }
      }
    }

    function getCleanWhatsAppNumber() {
      return WHATSAPP_NUMBER.replace(/[\s\+\-()]/g, '');
    }

    function getWhatsAppLink(productName, productId, imageUrl) {
      const cleanNumber = getCleanWhatsAppNumber();
      const message =
        `Hello, I want to inquire about this product:\n\n` +
        `Product Name: ${productName}\n` +
        `Product ID: ${productId}\n` +
        `Image URL: ${imageUrl}`;
      const encodedMessage = encodeURIComponent(message);
      return `https://wa.me/${cleanNumber}?text=${encodedMessage}`;
    }

    function parseGvizJson(rawText) {
      const jsonTextMatch = rawText.match(/google\.visualization\.Query\.setResponse\((.*?)\);/s);
      if (!jsonTextMatch || jsonTextMatch.length < 2) throw new Error('Could not find Google Visualization response data.');
      const gvizData = JSON.parse(jsonTextMatch[1]);
      if (!gvizData.table || !gvizData.table.rows) throw new Error('Invalid G-Viz structure.');

      const columns = gvizData.table.cols.map(col => col.label);
      const HEADER_MAP = {
        'ID': ['ID', 'Product ID', 'id'],
        'Name': ['Name', 'Product Name'],
        'Category': ['Category', 'Type'],
        'Price': ['Price', 'Amount'],
        'ImageURL': ['ImageURL', 'Image Link', 'Image URL'],
        'Description': ['Description', 'Details']
      };

      const headerIndices = {};
      Object.keys(HEADER_MAP).forEach(key => {
        for (const header of HEADER_MAP[key]) {
          const idx = columns.findIndex(c => c.trim().toLowerCase() === header.toLowerCase());
          if (idx !== -1 && headerIndices[key] === undefined) headerIndices[key] = idx;
        }
      });

      const seenIds = new Set();
      return gvizData.table.rows.map(row => {
        const product = {
          ID: row.c[headerIndices['ID']]?.v || '',
          Name: row.c[headerIndices['Name']]?.v || '',
          Category: row.c[headerIndices['Category']]?.v || '',
          Price: row.c[headerIndices['Price']]?.f || row.c[headerIndices['Price']]?.v || 'Inquire for Price',
          ImageURL: row.c[headerIndices['ImageURL']]?.v || '',
          Description: row.c[headerIndices['Description']]?.v || 'High-quality furniture.'
        };
        if (!product.ID || !product.Name || !product.Category || seenIds.has(product.ID)) return null;
        seenIds.add(product.ID);
        return product;
      }).filter(Boolean);
    }

    async function fetchProducts() {
      const container = document.getElementById('products-container');
      const loading = document.getElementById('loading-indicator');
      loading.classList.remove('hidden');
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const text = await res.text();
        const products = parseGvizJson(text);
        allProducts = products;
        setupCategoryFilters(allProducts);
        renderProducts(allProducts, container);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-red-500 text-center py-8">Error loading products.</p>`;
      } finally {
        loading.classList.add('hidden');
      }
    }

    function setupCategoryFilters(products) {
      const categories = new Set(['All']);
      products.forEach(p => categories.add(p.Category || 'Other'));
      const container = document.getElementById('filter-buttons');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.className = 'filter-btn px-4 py-2 mx-1 my-1 rounded-full text-sm font-semibold bg-white text-accent-yellow border border-accent-yellow hover:bg-accent-yellow hover:text-white';
        if (cat === 'All') btn.classList.add('bg-accent-yellow', 'text-white');
        btn.addEventListener('click', () => filterProducts(cat));
        container.appendChild(btn);
      });
    }

    function filterProducts(category) {
      const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.Category === category);
      renderProducts(filtered, document.getElementById('products-container'));
    }

    function renderProducts(products, container) {
      if (!products.length) {
        container.innerHTML = '<p class="text-center text-gray-500 col-span-full py-10">No products found.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl shadow-lg overflow-hidden transition-all duration-300 hover:shadow-2xl">
          <div class="overflow-hidden rounded-t-xl">
            <img src="${p.ImageURL || 'https://placehold.co/600x400'}" alt="${p.Name}" class="w-full h-64 object-cover transition-transform duration-300 hover:scale-105">
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-accent-yellow mb-2">${p.Name}</h3>
            <p class="text-lg font-semibold text-accent-yellow mb-3">${p.Price}</p>
            <p class="text-sm text-gray-600 mb-4 h-12 overflow-hidden">${p.Description}</p>
            <a href="${getWhatsAppLink(p.Name, p.ID, p.ImageURL)}" target="_blank" class="block text-center bg-accent-yellow text-white font-bold py-2 rounded-lg hover:bg-yellow-600 transition">Inquire on WhatsApp</a>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</head>
